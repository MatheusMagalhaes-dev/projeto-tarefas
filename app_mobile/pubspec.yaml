
name: app_mobile
description: "AMVE Flow - Aplicativo de produtividade."
publish_to: 'none'

version: 0.1.1+2

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/amve_flow_icon.png"
  adaptive_icon_background: "#09051F"
  adaptive_icon_foreground: "assets/images/amve_flow_icon.png"
